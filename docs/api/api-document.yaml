openapi: 3.0.3
info:
  title: Vitals Journal API
  version: 0.5.0
  description: 1차 MVP API 문서입니다. Refresh Token, 서버 로그아웃, 회원 탈퇴, 수정/삭제 고도화 기능은 제외합니다.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: User
  - name: Threshold
  - name: HealthRecord
  - name: Alert
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: 회원가입
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "409":
          description: 이메일 또는 닉네임이 이미 사용 중입니다.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                emailAlreadyExists:
                  summary: 이메일 중복
                  value:
                    type: http://localhost:8080/problems/email-already-exists
                    title: Email already exists
                    status: 409
                    detail: Email already exists
                    instance: /auth/register
                    errorCode: EMAIL_ALREADY_EXISTS
                nicknameAlreadyExists:
                  summary: 닉네임 중복
                  value:
                    type: http://localhost:8080/problems/nickname-already-exists
                    title: Nickname already exists
                    status: 409
                    detail: Nickname already exists
                    instance: /auth/register
                    errorCode: NICKNAME_ALREADY_EXISTS
  /auth/login:
    post:
      tags:
        - Auth
      summary: 로그인
      description: 1차 MVP에서는 refresh token 없이 access token만 반환합니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          description: 이메일 또는 비밀번호가 올바르지 않습니다.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                example:
                  value:
                    type: http://localhost:8080/problems/invalid-credentials
                    title: Invalid credentials
                    status: 401
                    detail: Email or password is invalid
                    instance: /auth/login
                    errorCode: INVALID_CREDENTIALS
  /user/me:
    get:
      tags:
        - User
      summary: 내 정보 조회
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMeResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
  /thresholds:
    get:
      tags:
        - Threshold
      summary: Threshold 목록 조회
      description: 현재 로그인한 사용자의 threshold 전체를 조회합니다.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThresholdListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
  /thresholds/{metric}:
    put:
      tags:
        - Threshold
      summary: Metric 단위 Threshold 설정
      description: 현재 로그인한 사용자의 특정 metric threshold를 생성하거나 업데이트합니다. 1차 MVP에서는 range
        규칙만 지원합니다.
      parameters:
        - $ref: "#/components/parameters/MetricPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThresholdUpsertRequest"
      responses:
        "200":
          description: OK. 기존 threshold가 있으면 업데이트합니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Threshold"
        "201":
          description: Created. 기존 threshold가 없으면 생성합니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Threshold"
        "400":
          description: 요청 본문 검증 실패 또는 잘못된 threshold 범위
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                validation_error:
                  value:
                    type: http://localhost:8080/problems/validation-error
                    title: Request validation failed
                    status: 400
                    detail: Request validation failed
                    instance: /thresholds/HR
                    errorCode: VALIDATION_ERROR
                    errors:
                      - name: minValue
                        reason: required
                invalid_range:
                  value:
                    type: http://localhost:8080/problems/invalid-threshold-range
                    title: Invalid threshold range
                    status: 400
                    detail: minValue must be less than or equal to maxValue
                    instance: /thresholds/HR
                    errorCode: INVALID_THRESHOLD_RANGE
                    errors:
                      - name: maxValue
                        reason: invalid
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
  /health-records:
    get:
      tags:
        - HealthRecord
      summary: 건강 측정 기록 목록 조회
      description: 현재 로그인한 사용자의 건강 기록을 최신 measuredAt 순으로 조회합니다. 1차 MVP에서는 필터와 페이지네이션을
        제공하지 않습니다.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthRecordListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
    post:
      tags:
        - HealthRecord
      summary: 건강 측정 기록 생성
      description: "- 기록 생성 시 현재 설정된 threshold 기준으로 즉시 평가합니다.

        - 설정된 threshold가 없는 metric은 평가하지 않습니다.

        - BP 기록은 BP_SYS, BP_DIA metric으로 나누어 평가합니다.

        - 평가 결과 violation이 1개 이상이면 alert 1개를 생성합니다."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthRecordCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthRecordDetailResponse"
        "400":
          description: 요청 본문 검증 실패 또는 type에 맞지 않는 필드 조합
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                validation_error:
                  value:
                    type: http://localhost:8080/problems/validation-error
                    title: Request validation failed
                    status: 400
                    detail: Request validation failed
                    instance: /health-records
                    errorCode: VALIDATION_ERROR
                    errors:
                      - name: measuredAt
                        reason: required
                type_mismatch:
                  value:
                    type: http://localhost:8080/problems/health-record-type-mismatch
                    title: Health record type mismatch
                    status: 400
                    detail: The field set does not match the health record type
                    instance: /health-records
                    errorCode: HEALTH_RECORD_TYPE_MISMATCH
                    errors:
                      - name: diastolic
                        reason: invalid
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
  /health-records/{healthRecordId}:
    get:
      tags:
        - HealthRecord
      summary: 건강 측정 기록 단건 조회
      description: 기록 상세와 평가 당시 snapshot으로 저장된 violation 목록을 함께 조회합니다.
      parameters:
        - $ref: "#/components/parameters/HealthRecordId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthRecordDetailResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "404":
          description: 해당 건강 기록을 찾을 수 없습니다.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                example:
                  value:
                    type: http://localhost:8080/problems/health-record-not-found
                    title: Health record not found
                    status: 404
                    detail: No health record found for the given id
                    instance: /health-records/123
                    errorCode: HEALTH_RECORD_NOT_FOUND
  /alerts:
    get:
      tags:
        - Alert
      summary: Alert 목록 조회
      description: 현재 로그인한 사용자의 앱 내 알림을 최신순으로 조회합니다. 알림 item의 healthRecordId로 건강 기록
        상세를 조회할 수 있습니다.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
  /alerts/{alertId}/read:
    patch:
      tags:
        - Alert
      summary: Alert 읽음 처리
      description: Alert의 readAt을 현재 시각으로 설정합니다. 이미 읽은 alert면 기존 상태를 반환합니다.
      parameters:
        - $ref: "#/components/parameters/AlertId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "404":
          description: 해당 alert를 찾을 수 없습니다.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                example:
                  value:
                    type: http://localhost:8080/problems/alert-not-found
                    title: Alert not found
                    status: 404
                    detail: No alert found for the given id
                    instance: /alerts/10/read
                    errorCode: ALERT_NOT_FOUND
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    HealthRecordId:
      name: healthRecordId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    MetricPath:
      name: metric
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Metric"
    AlertId:
      name: alertId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    ValidationProblem:
      description: 요청 본문 또는 파라미터 검증 실패. errors 배열은 검증 오류에서만 포함됩니다.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            example:
              value:
                type: http://localhost:8080/problems/validation-error
                title: Request validation failed
                status: 400
                detail: Request validation failed
                instance: /example
                errorCode: VALIDATION_ERROR
                errors:
                  - name: fieldName
                    reason: required
    UnauthorizedProblem:
      description: 인증 정보가 없거나 access token이 유효하지 않습니다.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            example:
              value:
                type: http://localhost:8080/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: Authentication is required
                instance: /example
                errorCode: UNAUTHORIZED
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details 기반 에러 응답입니다. errorCode는 서비스 도메인 에러 코드이며,
        errors는 검증 오류에서만 포함됩니다.
      properties:
        type:
          type: string
          format: uri
          example: http://localhost:8080/problems/validation-error
        title:
          type: string
          example: Request validation failed
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
          example: Request validation failed
        instance:
          type: string
          format: uri-reference
          example: /health-records
        errorCode:
          type: string
          enum:
            - VALIDATION_ERROR
            - INVALID_REQUEST
            - EMAIL_ALREADY_EXISTS
            - NICKNAME_ALREADY_EXISTS
            - INVALID_CREDENTIALS
            - UNAUTHORIZED
            - HEALTH_RECORD_NOT_FOUND
            - HEALTH_RECORD_TYPE_MISMATCH
            - INVALID_THRESHOLD_RANGE
            - ALERT_NOT_FOUND
            - INTERNAL_SERVER_ERROR
        errors:
          type: array
          items:
            $ref: "#/components/schemas/InvalidParam"
      required:
        - type
        - title
        - status
        - detail
        - instance
        - errorCode
    InvalidParam:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          example: measuredAt
        reason:
          type: string
          description: required 또는 invalid를 사용합니다.
          example: required
      required:
        - name
        - reason
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 72
          pattern: ^[A-Za-z0-9!@#$%&*._?-]+$
          description: "영문 대소문자, 숫자, 특수문자(! @ # $ % & * . _ ? -)만 허용합니다."
        nickname:
          type: string
          minLength: 1
          maxLength: 50
      required:
        - email
        - password
        - nickname
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 72
      required:
        - email
        - password
    AuthResponse:
      type: object
      description: 1차 MVP 인증 응답입니다. refresh token 없이 access token만 반환합니다.
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
      required:
        - accessToken
        - tokenType
    UserMeResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
          maxLength: 320
        nickname:
          type: string
          maxLength: 50
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - nickname
        - createdAt
    HealthRecordType:
      type: string
      enum:
        - HR
        - BP
    Metric:
      type: string
      enum:
        - HR
        - BP_SYS
        - BP_DIA
    Threshold:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        metric:
          $ref: "#/components/schemas/Metric"
        minValue:
          type: number
          format: double
          nullable: true
        maxValue:
          type: number
          format: double
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - metric
        - minValue
        - maxValue
        - createdAt
        - updatedAt
      description: minValue와 maxValue 중 최소 하나는 null이 아니어야 합니다.
    ThresholdUpsertRequest:
      type: object
      properties:
        minValue:
          type: number
          format: double
          nullable: true
        maxValue:
          type: number
          format: double
          nullable: true
      required:
        - minValue
        - maxValue
      description: minValue와 maxValue 중 최소 하나는 null이 아니어야 하며, 둘 다 존재하면 minValue <=
        maxValue여야 합니다.
    ThresholdListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Threshold"
      required:
        - items
    HealthRecord:
      type: object
      description: 단일 테이블 모델입니다. type=HR이면 bpm을 사용하고, type=BP이면 systolic/diastolic을 사용합니다.
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/HealthRecordType"
        measuredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        bpm:
          type: integer
          minimum: 1
          maximum: 300
          nullable: true
        systolic:
          type: integer
          minimum: 50
          maximum: 300
          nullable: true
        diastolic:
          type: integer
          minimum: 30
          maximum: 200
          nullable: true
        memo:
          type: string
          nullable: true
          maxLength: 500
      required:
        - id
        - userId
        - type
        - measuredAt
        - createdAt
    HealthRecordCreateRequest:
      type: object
      description: type=HR이면 bpm이 필수이고, type=BP이면 systolic과 diastolic이 모두 필수입니다.
      properties:
        type:
          $ref: "#/components/schemas/HealthRecordType"
        measuredAt:
          type: string
          format: date-time
        bpm:
          type: integer
          minimum: 1
          maximum: 300
          nullable: true
        systolic:
          type: integer
          minimum: 50
          maximum: 300
          nullable: true
        diastolic:
          type: integer
          minimum: 30
          maximum: 200
          nullable: true
        memo:
          type: string
          nullable: true
          maxLength: 500
      required:
        - type
        - measuredAt
    HealthRecordListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HealthRecord"
      required:
        - items
    HealthRecordDetailResponse:
      type: object
      properties:
        healthRecord:
          $ref: "#/components/schemas/HealthRecord"
        violations:
          type: array
          items:
            $ref: "#/components/schemas/RecordViolation"
      required:
        - healthRecord
        - violations
    RecordViolation:
      type: object
      description: 평가 당시의 threshold 범위를 snapshot으로 저장한 위반 내역입니다.
      properties:
        id:
          type: integer
          format: int64
        healthRecordId:
          type: integer
          format: int64
        metric:
          $ref: "#/components/schemas/Metric"
        measuredValue:
          type: number
          format: double
        minValueSnapshot:
          type: number
          format: double
          nullable: true
        maxValueSnapshot:
          type: number
          format: double
          nullable: true
        direction:
          type: string
          enum:
            - below_min
            - above_max
        evaluatedAt:
          type: string
          format: date-time
      required:
        - id
        - healthRecordId
        - metric
        - measuredValue
        - minValueSnapshot
        - maxValueSnapshot
        - direction
        - evaluatedAt
    Alert:
      type: object
      properties:
        id:
          type: integer
          format: int64
        healthRecordId:
          type: integer
          format: int64
        message:
          type: string
          maxLength: 255
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - healthRecordId
        - message
        - readAt
        - createdAt
    AlertListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
      required:
        - items
